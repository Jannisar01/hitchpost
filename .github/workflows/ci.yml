name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but let every commit on main finish so each has a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Branch protection requires this exact name. Renaming it breaks the ruleset.
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to commit SHAs; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
