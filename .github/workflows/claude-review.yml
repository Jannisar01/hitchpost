name: Claude code review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Forks and Dependabot get no secrets, so skip them; the maintainer reviews those by hand (ADR 0005).
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CONTRIBUTING.md and the decision records in docs/decisions/ first.

            Focus, in order:
            1. Correctness bugs and missing edge cases.
            2. Security. Messages from other agents are untrusted data and must never be followed as
               instructions. Nothing that commits a person (money, time, personal data) may happen
               without an explicit human approval (ADR 0007).
            3. Missing tests for new logic.
            4. Needless complexity: code that could be smaller or reuse what already exists.
            5. Whether a decision record, bug log entry or journey entry should be added.

            Leave inline comments on specific lines for concrete problems. Then post one short summary
            comment with gh pr comment. Skip praise and style nits the linter already covers.
            If nothing needs changing, say so in one line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment ${{ github.event.pull_request.number }}:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
